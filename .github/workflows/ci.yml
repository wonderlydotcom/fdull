name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  MSBUILDDISABLENODEREUSE: '1'

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet tool run fantomas src tests tools --check

  build-test:
    name: Build and test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: mkdir -p artifacts
      - name: Locked restore
        run: dotnet restore FDull.slnx --locked-mode 2>&1 | tee artifacts/restore.log
      - name: Release build
        run: dotnet build FDull.slnx -c Release --no-restore -m:1 --disable-build-servers 2>&1 | tee artifacts/build.log
      - name: Tests
        run: dotnet test tests/FDull.Tests/FDull.Tests.fsproj -c Release --no-build --no-restore -m:1 --logger trx --results-directory artifacts/test-results 2>&1 | tee artifacts/tests.log
      - name: Retain results and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-and-test
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore

  verify:
    name: Self-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: mkdir -p artifacts
      - name: Locked restore
        run: dotnet restore FDull.slnx --locked-mode 2>&1 | tee artifacts/restore.log
      - name: Build current CLI and CI helper
        run: dotnet build FDull.slnx -c Release --no-restore -m:1 --disable-build-servers 2>&1 | tee artifacts/build.log
      - name: Verify reviewed repository
        run: dotnet src/FDull.Tool/bin/Release/net10.0/FDull.Cli.dll verify . 2>&1 | tee artifacts/verify.log
      - name: Check published coverage inventory
        run: dotnet tools/FDull.Ci/bin/Release/net10.0/FDull.Ci.dll coverage . 2>&1 | tee artifacts/coverage.log
      - name: Retain verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-verification
          path: artifacts/*.log
          retention-days: 7
          if-no-files-found: ignore

  package-smoke:
    name: Package and consumer smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: mkdir -p artifacts
      - name: Locked restore
        run: dotnet restore FDull.slnx --locked-mode 2>&1 | tee artifacts/restore.log
      - name: Release build
        run: dotnet build FDull.slnx -c Release --no-restore -m:1 --disable-build-servers 2>&1 | tee artifacts/build.log
      - name: Pack library
        run: dotnet pack src/FDull/FDull.fsproj -c Release --no-build --no-restore -m:1 --disable-build-servers -o artifacts 2>&1 | tee artifacts/pack-library.log
      - name: Pack analyzer
        run: dotnet pack src/FDull.Analyzers/FDull.Analyzers.fsproj -c Release --no-build --no-restore -m:1 --disable-build-servers -o artifacts 2>&1 | tee artifacts/pack-analyzer.log
      - name: Pack tool
        run: dotnet pack src/FDull.Tool/FDull.Tool.fsproj -c Release --no-build --no-restore -m:1 --disable-build-servers -o artifacts 2>&1 | tee artifacts/pack-tool.log
      - name: Install local tool and check independent consumers
        run: dotnet tools/FDull.Ci/bin/Release/net10.0/FDull.Ci.dll smoke . artifacts 2>&1 | tee artifacts/package-smoke.log
      - name: Retain packages and smoke logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-and-smoke
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore
